[project]
name = "esport-api"
version = "0.1.0"
description = "Self-hosted, independent live esports data API. Multi-game by design, League of Legends first."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kwickos" }]
requires-python = ">=3.11"
keywords = ["esports", "league-of-legends", "lol", "live-data", "api", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",       # Local DB by default (dev)
    "asyncpg>=0.29",         # Postgres (prod)
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Kwickos/esport-api"
Repository = "https://github.com/Kwickos/esport-api"
Issues = "https://github.com/Kwickos/esport-api/issues"
Changelog = "https://github.com/Kwickos/esport-api/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: Depends(...) as a default argument value is the correct FastAPI idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
